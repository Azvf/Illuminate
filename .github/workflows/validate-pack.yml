name: Validate Pack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install illuminate
        run: pip install -e .

      - name: Validate core pack (incl. contract schema conformance)
        run: illuminate pack validate packs/core

      - name: Contract schema consistency tests
        run: python -m unittest tests.test_validate -v

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Materialization smoke test
        run: |
          TMPDIR=$(mktemp -d)
          illuminate mount create --pack packs/core --repo "$TMPDIR"
          echo "PASS: Materialization completed without error"

      - name: Materialization skill filter smoke test
        run: |
          TMPDIR=$(mktemp -d)
          OUTPUT=$(illuminate mount create \
            --pack packs/core \
            --repo "$TMPDIR" \
            --skill illuminate.layer-debug \
            --skill illuminate.grilling 2>&1)
          SESSION_DIR=$(echo "$OUTPUT" | grep -oP 'Dir:\s+\K\S+')
          test -f "$SESSION_DIR/.claude/skills/layer-debug/SKILL.md" && echo "PASS: layer-debug mounted"
          test ! -f "$SESSION_DIR/.claude/skills/perf-profile/SKILL.md" && echo "PASS: perf-profile excluded"
          echo "Skill filter smoke test passed"

      - name: Compat generate smoke test
        run: |
          illuminate compat generate --pack packs/core
          test -d ".claude/skills" && echo "PASS: .claude/skills/ created"
          test -f ".claude/skills/layer-debug/SKILL.md" && echo "PASS: skills copied"

      - name: Compat check
        run: |
          illuminate compat check --pack packs/core && echo "PASS: compat check passed"

      - name: Mount verify smoke test
        run: |
          TMPDIR=$(mktemp -d)
          OUTPUT=$(illuminate mount create --pack packs/core --repo "$TMPDIR" 2>&1)
          echo "$OUTPUT"
          SESSION_DIR=$(echo "$OUTPUT" | grep -oP 'Dir:\s+\K\S+')
          illuminate mount verify "$SESSION_DIR" && echo "PASS: mount verify passed"

      - name: CodeBuddy sync smoke test
        run: |
          TMPDIR=$(mktemp -d)
          illuminate sync codebuddy --pack packs/core --repo "$TMPDIR"
          test -d "$TMPDIR/.codebuddy/rules/illuminate" && echo "PASS: rules synced"
          test -d "$TMPDIR/.codebuddy/skills/layer-debug" && echo "PASS: skills synced"
          test -f "$TMPDIR/.codebuddy/commands/record-knowledge.md" && echo "PASS: commands synced"
          test -f "$TMPDIR/.illuminate/codebuddy-lock.json" && echo "PASS: lock created"

      - name: CodeBuddy sync filter smoke test
        run: |
          TMPDIR=$(mktemp -d)
          illuminate sync codebuddy --pack packs/core --repo "$TMPDIR" --skill illuminate.record-knowledge
          test -d "$TMPDIR/.codebuddy/skills/record-knowledge" && echo "PASS: record-knowledge synced"
          test ! -d "$TMPDIR/.codebuddy/skills/layer-debug" && echo "PASS: layer-debug excluded"

      - name: CodeBuddy sync check smoke test
        run: |
          TMPDIR=$(mktemp -d)
          illuminate sync codebuddy --pack packs/core --repo "$TMPDIR"
          illuminate sync check --repo "$TMPDIR" --harness codebuddy && echo "PASS: check passed"

      - name: CodeBuddy sync clean smoke test
        run: |
          TMPDIR=$(mktemp -d)
          illuminate sync codebuddy --pack packs/core --repo "$TMPDIR"
          illuminate sync clean --repo "$TMPDIR" --harness codebuddy
          test ! -d "$TMPDIR/.codebuddy/rules/illuminate" && echo "PASS: rules cleaned"
          test -f "$TMPDIR/.codebuddy/CODEBUDDY.md" && echo "PASS: CODEBUDDY.md preserved"
